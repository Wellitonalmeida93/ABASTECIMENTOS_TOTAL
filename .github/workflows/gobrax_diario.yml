name: Sincronização Diária Gobrax

on:
  schedule:
    # Executa todos os dias às 06:00 (Horário de Brasília / 09:00 UTC)
    - cron: '0 9 * * *'
  workflow_dispatch: # Permite acionar o script manualmente a qualquer momento

jobs:
  executar-script:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar ambiente Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar bibliotecas necessárias
        run: |
          python -m pip install --upgrade pip
          pip install requests psycopg2-binary pandas tqdm python-dotenv

      - name: Executar rotina diária
        env:
          TOKEN_GOBRAX: ${{ secrets.TOKEN_GOBRAX }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: python rotina_diaria_gobrax.py
