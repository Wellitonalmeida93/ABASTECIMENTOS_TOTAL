name: Sincronizador Gobrax Mês Atual

on:
  schedule:
    # Roda todos os dias às 06:00 UTC (03:00 Horário de Brasília)
    - cron: '0 6 * * *'
  workflow_dispatch: # Permite rodar manualmente com 1 clique no GitHub

jobs:
  sync-gobrax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install requests psycopg2-binary pandas tqdm python-dotenv

      - name: Executar Script
        env:
          TOKEN_GOBRAX: ${{ secrets.TOKEN_GOBRAX }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_HOST_SUPA: ${{ secrets.DB_HOST_SUPA }}
          DB_PORT_SUPA: ${{ secrets.DB_PORT_SUPA }}
          DB_NAME_SUPA: ${{ secrets.DB_NAME_SUPA }}
          DB_USER_SUPA: ${{ secrets.DB_USER_SUPA }}
          DB_PASSWORD_SUPA: ${{ secrets.DB_PASSWORD_SUPA }}
        run: python sincronizar_gobrax_mes_atual.py
