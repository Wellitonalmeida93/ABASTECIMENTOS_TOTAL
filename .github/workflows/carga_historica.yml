name: Carga Historica Supabase

on:
  workflow_dispatch: # Permite rodar apenas manualmente pelo botão

jobs:
  executar-historico:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar Código do Repositório
        uses: actions/checkout@v4

      - name: Configurar Ambiente Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests supabase psycopg2-binary tqdm openpyxl python-dotenv

      - name: Rodar a Carga Historica
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TOKEN_GOBRAX: ${{ secrets.TOKEN_GOBRAX }}
          AUTHORIZATION_TICKET: ${{ secrets.AUTHORIZATION_TICKET }}
          CODIGO_CLIENTE: ${{ secrets.CODIGO_CLIENTE }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: python carga_historica.py
